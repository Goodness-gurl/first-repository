<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- <link rel="stylesheet" href="../../html/CSS/indexlay.css"> -->
    <style>
      .table {
        display: grid;
        grid-template-columns: 1fr 3fr;
        grid-template-areas:
          "header header"
          "link main"
          "footer footer";
      }
      .header {
        grid-area: header;
        border-bottom: 2px solid black;
        text-align: center;
      }
      .links {
        grid-area: link;
        height: 100vh;
        border-right: 2px solid black;
      }
      .main {
        grid-area: main;
        height: 100vh;
      }
      .footer {
        grid-area: footer;
        text-align: center;
        border-top: 2px solid black;
      }
    </style>
  </head>
  <body>
    <div class="table">
      <div class="header">
        <h2>My Header</h2>
      </div>
      <div class="links">
        <div>
          <a href="#">Link 1</a><br />
          <a href="#">Link 2</a><br />
          <a href="#">Link 3</a>
        </div>
      </div>

      <div class="main">
        <div>
          <h3>Lorem Ipsum</h3>
          <p>
            Lorem ipsum odor amet, consectetuer adipiscing elit. Ridiculus sit
            nisl laoreet facilisis aliquet. Potenti dignissim litora eget monte
            s rhoncus sapien neque urna. Cursus libero sapien integer magnis
            ligula lobortis quam ut.
          </p>
        </div>
      </div>

      <div class="footer">
        <h2>Footer</h2>
      </div>
    </div>
  </body>
</html>
