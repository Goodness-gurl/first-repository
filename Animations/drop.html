<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .text{
            position: relative;
            
        }
        .text:hover .drop{
            display: block;
        }
        .drop{
            display: none;
            position: absolute;

        }
    </style>
</head>
<body>
    <div class="text">
        <p>Hello world</p>
        <div class="drop">Welcome to class </div>
    </div>
    
</body>
</html>
