<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }
         .container div{
            width: 100%;
            height: 300px;
            border-radius: 50%;
            background-color: pink;
            display: flex;
            align-items: center;
            justify-content: center;
         }
        @media (max-width: 768px) {
            .container{
                grid-template-columns: 1fr;
            }
        } 
        @media (max-width: 320px) {
            .container div{
                color: white;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div>fghgfdg</div>
        <div>ertyui</div>
        <div>edrfgvb</div>
        <div>xcvbnm</div>
        <div>wertyujkm</div>
        <div>rdcfvnjk</div>
    </div>
</body>
</html>
