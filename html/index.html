    <!-- Attribute	What it does	Example
width - Sets width for applicable elements - <img width="200">
height - Sets height for applicable elements - <img height="100">
target	- Controls where a link opens - <a href="https://example.com" target="_blank">Open</a>
for	- Connects a label to a form control by ID - <label for="age">Age</label>
checked	- Makes a checkbox or radio button selected initially - <input type="checkbox" checked>
readonly - Prevents normal editing of a field - <input value="Hello" readonly>
placeholder	- Shows a hint in an empty input - <input placeholder="Your email">
action - Specifies where form data is submitted - <form action="/submit">
method - Specifies the HTTP method for submitting a form - <form method="post"> -->
