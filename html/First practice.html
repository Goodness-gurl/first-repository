<!-- - <label> — creates a label that describes an input.
- for="username" — connects the label to the input whose id is "username".
- id="username" — gives the input a unique identity.
Important: The value of for must match the value of the input's id.
2. What does the for attribute do?

1. Makes labels clickable
When you click the label, the browser focuses the connected input.




2. Connects a label to an input
It tells the browser which input the label describes.




3. Improves accessibility
Screen readers can identify which label belongs to an input, helping people understand forms. -->
